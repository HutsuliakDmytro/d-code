<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#33241d"/>
      <stop offset="50%" stop-color="#1d1519"/>
      <stop offset="100%" stop-color="#100f12"/>
    </linearGradient>
    <linearGradient id="letter" x1="0.1" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f3ab8e"/>
      <stop offset="40%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#a8401f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle: 22% corner radius, matching macOS system icons -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#sheen)"/>
  <rect x="66.5" y="66.5" width="891" height="891" rx="198" ry="198"
        fill="none" stroke="#4a3529" stroke-width="5"/>

  <!--
    Letter D: a straight stem on the left and a bowl swept from it.
    Drawn as one path with evenodd fill so the counter stays open — a separate
    background-coloured shape would break on any other backdrop.
  -->
  <path fill="url(#letter)" fill-rule="evenodd" d="
    M 316 300
    h 214
    c 132 0 224 90 224 212
    s -92 212 -224 212
    H 316
    a 24 24 0 0 1 -24 -24
    V 324
    a 24 24 0 0 1 24 -24
    Z
    M 420 388
    v 248
    h 106
    c 76 0 126 -50 126 -124
    s -50 -124 -126 -124
    Z"/>
</svg>
